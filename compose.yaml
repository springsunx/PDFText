services:
  pdftotext:
    build:
      context: .
    image: ${PDFTEXT_IMAGE:-ghcr.io/springsunx/pdftext:latest}
    container_name: pdftext
    restart: unless-stopped
    ports:
      - "${PDFTEXT_PORT:-8000}:8000"
    environment:
      PDFTEXT_ADDR: ":8000"
      PDFTEXT_MAX_FILE_SIZE_MB: "${PDFTEXT_MAX_FILE_SIZE_MB:-50}"
      PDFTEXT_MAX_OUTPUT_SIZE_MB: "${PDFTEXT_MAX_OUTPUT_SIZE_MB:-100}"
      PDFTEXT_TIMEOUT_SECONDS: "${PDFTEXT_TIMEOUT_SECONDS:-120}"
      PDFTEXT_MCP_MAX_FILE_SIZE_MB: "${PDFTEXT_MCP_MAX_FILE_SIZE_MB:-2}"
      PDFTEXT_MCP_ALLOWED_ROOT: /data/input
      PDFTEXT_MCP_ALLOWED_HOSTS: "${PDFTEXT_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,[::1],[::1]:*,pdftotext,pdftotext:*}"
      PDFTEXT_MCP_ALLOWED_ORIGINS: "${PDFTEXT_MCP_ALLOWED_ORIGINS:-http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*}"
    volumes:
      - ./data/input:/data/input:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
